[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-trading-bot"
version = "1.0.0"
description = "AI stacked ensemble trading bot for Polymarket BTC 5m/15m/1h Up-Down markets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Polymarket Bot Contributors" }]
keywords = [
    "polymarket",
    "trading-bot",
    "prediction-markets",
    "xgboost",
    "lightgbm",
    "arbitrage",
    "btc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "structlog>=24.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "mypy>=1.8",
]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
polymarket-bot = "polymarket_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
